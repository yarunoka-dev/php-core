name: php-next

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.6'
          tools: composer:v2
          coverage: none

      - name: Install dependencies from lock files
        run: composer install --no-interaction --no-progress --prefer-dist

      # Run the newest PHPUnit allowed by the constraint so failures point
      # at this library, not at an outdated test runner
      - name: Update PHPUnit to the latest release
        run: composer bin phpunit update --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
