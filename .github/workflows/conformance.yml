# The release gate against the spec's conformance kit. Runs on every
# push to main rather than per PR: conformance is a claim about a
# release, and the tag ruleset requires this check to pass on the commit
# a tag points at — running on main gives every commit a tag could point
# at its verdict with nothing to remember to dispatch, and a release
# without a green run on its commit is rejected at the push. Dispatch
# stays for ad-hoc runs.
name: conformance

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    env:
      # The kit version conformance is claimed against. go install builds
      # it from source and verifies it against Go's checksum database.
      KIT_VERSION: v0.1.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          # The floor of the supported range — the claim is made in the
          # weakest environment it covers. PHP-version variance is the
          # per-PR unit suite's business, which runs the whole matrix.
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install dependencies from lock files
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          # There is no go.sum here for the dependency cache to key on
          cache: false

      - name: Install the conformance kit
        run: go install "github.com/yarunoka-dev/test/cmd/yarunoka-test@${KIT_VERSION}"

      - name: Run the conformance suite (eval)
        run: '"$(go env GOPATH)/bin/yarunoka-test" eval php tests/Conformance/bin/adapter.php'
