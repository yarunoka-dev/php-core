name: release

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # No checkout: gh operates on the remote repository directly, so the
      # job never executes repository code with a write-scoped token.
      - name: Create GitHub release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

  # The website reads docs from released tags only, so every release must
  # rebuild it. The cross-repo call authenticates as the org's GitHub App —
  # its installation token is short-lived and scoped to the website
  # repository, and this job holds no GITHUB_TOKEN permissions at all.
  # The environment adds a deployment review: the job waits for an approval
  # before it starts, and the App's private key lives in the environment's
  # secrets, so no job outside this gate can read it.
  rebuild-website:
    needs: release
    runs-on: ubuntu-latest
    environment: website-rebuild
    permissions: {}
    steps:
      - name: Mint an installation token for the website
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.WEBSITE_DISPATCH_APP_ID }}
          private-key: ${{ secrets.WEBSITE_DISPATCH_APP_PRIVATE_KEY }}
          owner: yarunoka-dev
          repositories: website

      - name: Trigger the website rebuild
        run: >
          gh api "repos/yarunoka-dev/website/dispatches"
          -f event_type=docs-release
          -f "client_payload[repo]=$GITHUB_REPOSITORY"
          -f "client_payload[tag]=$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
